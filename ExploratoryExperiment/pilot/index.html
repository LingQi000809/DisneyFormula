<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Song Recognition Survey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Figtree:wght@400;500;600&display=swap">
    <script>
        window.SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxn3lT7AQopXTPJA-B_ccftCoMh74JtigYWjS0EmjNA6T1H5GIkZDqaCtqmX_BDtFag/exec";
    </script>
    <script src="clips.js"></script>
    <style>
        html {
            font-size: clamp(16px, 0.85rem + 0.35vw, 19px);
        }
        
         :root {
            --bg: #f4f4fa;
            --surface: #fff;
            --sunk: #ecedf6;
            --ink: #1b1d3a;
            --muted: #5d6083;
            --line: #dcdeee;
            --accent: #2f3192;
            --accent-ink: #fff;
            --accent-soft: #e4e5f8;
            --gold: #c4841a;
            --prize-bg: #fff8ec;
            --prize-line: #fbdfae;
            --prize-ink: #b4600c;
            --prize-chip: #ffe9c4;
            --bad: #b3261e;
            --warn: #a5561c;
            --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
            --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
        }
        
        @media (prefers-color-scheme: dark) {
             :root {
                --bg: #11122a;
                --surface: #1a1c3b;
                --sunk: #15173a;
                --ink: #ecebf7;
                --muted: #a3a5c8;
                --line: #2d3062;
                --accent: #a9adff;
                --accent-ink: #13143a;
                --accent-soft: #272a5c;
                --gold: #f2bd62;
                --prize-bg: #2c2418;
                --prize-line: #5e4724;
                --prize-ink: #ffc978;
                --prize-chip: #4a3820;
                --bad: #f28b82;
                --warn: #f0a868;
                color-scheme: dark;
            }
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 1rem/1.55 var(--f-body);
        }
        
        .wrap {
            max-width: 38.75rem;
            margin: 0 auto;
            padding: 1.75rem 1rem 4rem;
        }
        
        h2 {
            font: 700 1.5625rem/1.15 var(--f-display);
            margin: 0;
            letter-spacing: -0.01em;
        }
        
        p {
            margin: 0;
        }
        
        .eyebrow {
            font: 600 0.75rem/1 var(--f-body);
            letter-spacing: .09em;
            text-transform: uppercase;
            color: var(--gold);
        }
        
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px -18px rgba(20, 20, 70, .35);
        }
        
        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.875rem 1.5rem;
            border-bottom: 1px solid var(--line);
        }
        
        .brand {
            font: 700 0.9375rem var(--f-display);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .brand i {
            width: 0.5625rem;
            height: 0.5625rem;
            border-radius: 50%;
            background: var(--gold);
        }
        
        .prog {
            height: 0.3125rem;
            background: var(--sunk);
            overflow: hidden;
        }
        
        .prog i {
            display: block;
            height: 100%;
            background: var(--accent);
            width: 0;
            transition: width .2s;
        }
        
        .screen {
            padding: 1.875rem 1.75rem 1.75rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            min-height: 32.5rem;
        }
        
        @media (max-width: 480px) {
            .screen {
                padding: 1.5rem 1.125rem;
            }
            .top {
                padding: 0.75rem 1.125rem;
            }
        }
        
        .lede {
            color: var(--muted);
            line-height: 1.65;
        }
        
        .rules {
            display: grid;
            gap: 1.125rem;
            margin: 0;
            padding: 0;
            list-style: none;
            line-height: 1.65;
        }
        
        .rules li {
            display: grid;
            grid-template-columns: 1.625rem 1fr;
            gap: 0.75rem;
            font-size: 0.9375rem;
            color: var(--muted);
        }
        /* rule title: full-contrast ink, a touch larger; body text stays muted */
        
        .rules b {
            margin-bottom: 0.1875rem;
            font-size: 1rem;
            font-weight: 600;
            color: var(--ink);
        }
        
        .rules .k {
            font: 600 0.75rem/1.625rem var(--f-body);
            color: var(--accent);
            background: var(--accent-soft);
            border-radius: 6px;
            text-align: center;
            height: 1.625rem;
        }
        
        .rules b {
            display: block;
        }
        
        .prize {
            background: var(--prize-bg);
            border: 1px solid var(--prize-line);
            border-radius: 12px;
            padding: 1rem 1.125rem;
            display: grid;
            grid-template-columns: 2.5rem 1fr;
            gap: 0.5rem 0.875rem;
            line-height: 1.6;
        }
        
        .prize .ico {
            grid-row: span 3;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            background: var(--prize-chip);
            color: var(--prize-ink);
            display: grid;
            place-items: center;
        }
        
        .prize.short .ico {
            grid-row: span 2;
        }
        
        .prize .ico svg {
            width: 1.375rem;
            height: 1.375rem;
        }
        
        .prize strong {
            font: 700 1.0625rem var(--f-display);
            color: var(--prize-ink);
        }
        
        .prize p {
            font-size: 0.9062rem;
        }
        /* excerpt-to-excerpt transition: slide in + brief outline glow */
        
        @media (prefers-reduced-motion: no-preference) {
            .screen.enter {
                animation: enter .45s cubic-bezier(.2, .7, .2, 1);
            }
            .card.flash {
                animation: flash .7s ease-out;
            }
        }
        
        @keyframes enter {
            from {
                opacity: 0;
                transform: translateX(1.75rem);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        
        @keyframes flash {
            from {
                box-shadow: 0 0 0 4px var(--accent-soft), 0 10px 30px -18px rgba(20, 20, 70, .35);
            }
        }
        
        .small {
            font-size: 0.8438rem;
            color: var(--muted);
        }
        
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.625rem;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 0.375rem;
        }
        
        .btn {
            font: 600 0.9375rem/1 var(--f-body);
            border-radius: 10px;
            padding: 0.8125rem 1.125rem;
            border: 1px solid transparent;
            cursor: pointer;
            background: var(--accent);
            color: var(--accent-ink);
        }
        
        .btn[disabled] {
            opacity: .4;
            cursor: not-allowed;
        }
        
        .btn.ghost {
            background: transparent;
            color: var(--muted);
            border-color: var(--line);
        }
        
        button:focus-visible,
        input:focus-visible,
        label.opt:focus-within {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }
        
        .field {
            display: grid;
            gap: 0.375rem;
        }
        
        .field>label,
        .field>.lab {
            font-weight: 600;
            font-size: 0.9375rem;
        }
        
        .hint {
            font-size: 0.8438rem;
            color: var(--muted);
            margin-top: -2px;
        }
        
        .req {
            color: var(--bad);
            font-weight: 600;
        }
        
        input[type="text"],
        input[type="number"],
        input[type="email"] {
            font: 1rem var(--f-body);
            color: var(--ink);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 0.6875rem 0.75rem;
            width: 100%;
        }
        
        .err {
            font-size: 0.8125rem;
            color: var(--bad);
        }
        
        .opts {
            display: grid;
            gap: 0.5rem;
        }
        
        .opts.row {
            grid-template-columns: repeat(auto-fit, minmax(4rem, 1fr));
        }
        
        label.opt {
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
            border: 1px solid var(--line);
            border-radius: 11px;
            padding: 0.75rem 0.875rem;
            cursor: pointer;
            background: var(--surface);
            position: relative;
        }
        
        label.opt:hover {
            border-color: var(--accent);
        }
        
        label.opt input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        
        label.opt .dot {
            flex: none;
            width: 1.125rem;
            height: 1.125rem;
            border-radius: 50%;
            border: 2px solid var(--line);
            margin-top: 2px;
        }
        
        label.opt.sel {
            border-color: var(--accent);
            background: var(--accent-soft);
        }
        
        label.opt.sel .dot {
            border-color: var(--accent);
            background: radial-gradient(circle, var(--accent) 0 0.25rem, transparent 0.3125rem);
        }
        
        label.opt.dis {
            opacity: .45;
            cursor: not-allowed;
        }
        
        .opts.row label.opt {
            justify-content: center;
            padding: 0.625rem 0.375rem;
            font-weight: 500;
        }
        
        .opts.row label.opt .dot {
            display: none;
        }
        
        .opt-t {
            font-weight: 600;
            display: block;
        }
        
        .opt-s {
            font-size: 0.8438rem;
            color: var(--muted);
            display: block;
        }
        
        .player {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 1rem;
            align-items: center;
            background: var(--sunk);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 0.875rem 1rem;
        }
        
        .play {
            width: 3.375rem;
            height: 3.375rem;
            border-radius: 50%;
            border: 0;
            background: var(--accent);
            color: var(--accent-ink);
            cursor: pointer;
            display: grid;
            place-items: center;
        }
        
        .play[disabled] {
            background: var(--line);
            color: var(--muted);
            cursor: default;
        }
        
        .play svg {
            width: 1.25rem;
            height: 1.25rem;
        }
        
        .track {
            height: 0.375rem;
            border-radius: 3px;
            background: var(--line);
            overflow: hidden;
        }
        
        .track i {
            display: block;
            height: 100%;
            width: 0;
            background: var(--gold);
        }
        
        .pmeta {
            display: flex;
            justify-content: space-between;
            gap: 0.625rem;
            font-size: 0.7812rem;
            color: var(--muted);
            margin-top: 0.5rem;
        }
        
        .flag {
            font-size: 0.8125rem;
            color: var(--warn);
        }
        
        .spin {
            width: 1.75rem;
            height: 1.75rem;
            border: 3px solid var(--line);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: s 1s linear infinite;
        }
        
        @keyframes s {
            to {
                transform: rotate(360deg);
            }
        }
        
        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="card">
            <div class="screen" id="stage" aria-live="polite"></div>
            <div class="prog" aria-hidden="true"><i id="prog"></i></div>
        </div>
    </div>
    <script>
        (function() {
            "use strict";
            var FILES = (window.CLIPS || []).slice();
            var RESP = [{
                v: "title",
                t: "Yes, and I know the song title."
            }, {
                v: "recall",
                t: "I am certain I have heard this song, but I cannot recall its title."
            }, {
                v: "no",
                t: "No, I don't know this song."
            }];
            var COUNTS = ["0", "1", "2", "3–5", "6–10", "11–20", "21+"];
            /* Screening: located in the US, 18+, and Disney films + musicals >= 3
               (using each answer's lower bound, e.g. "3–5" counts as 3). Same rule
               as the Qualtrics branch. The criteria are never shown to participants. */
            var MIN_EXPOSURE = 3;
            var GIFT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12"/><path d="M12 8c-1.5-3-5-3.5-5-1.25S10 8 12 8zM12 8c1.5-3 5-3.5 5-1.25S14 8 12 8z"/></svg>';
            var SCREENED_KEY = "songSurveyScreened";
            var PROGRESS_KEY = "songSurveyProgress"; /* unfinished survey, for resuming */
            var PROGRESS_MAX_H = 72; /* forget unfinished surveys after this many hours */
            var stage = document.getElementById("stage");

            function $(id) {
                return document.getElementById(id);
            }

            function esc(s) {
                return String(s == null ? "" : s).replace(/[&<>"]/g, function(c) {
                    return {
                        "&": "&amp;",
                        "<": "&lt;",
                        ">": "&gt;",
                        '"': "&quot;"
                    }[c];
                });
            }

            function store(fn) {
                try {
                    return fn(window.localStorage);
                } catch (e) {
                    return null;
                }
            }
            /* Add ?reset to the link to clear the screened-out flag and any saved
               progress (for testing). */
            if (/[?&]reset\b/.test(location.search)) store(function(ls) {
                ls.removeItem(SCREENED_KEY);
                ls.removeItem(PROGRESS_KEY);
            });

            for (var i = FILES.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var x = FILES[i];
                FILES[i] = FILES[j];
                FILES[j] = x;
            }
            /* Demo: each participant hears N random excerpts. Set to 0 to use all. */
            var DEMO_N = 0;
            if (DEMO_N > 0) FILES = FILES.slice(0, DEMO_N);
            /* Estimated length shown on the welcome page, in minutes (rough guide:
               15 s per excerpt + 1 min for the questions). Update it with DEMO_N. */
            var EST_MINUTES = 20;
            var S = {
                screen: "welcome",
                k: 0,
                pid: "p_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
                trials: [],
                about: {
                    us: "",
                    age: "",
                    gender: "",
                    disney: "",
                    musicals: ""
                },
                draw: {
                    mode: "",
                    email: ""
                },
                result: null
            };
            var audios = {};

            /* ---------- resume ----------
               After the background questions and after every "Next excerpt", the
               page saves its place in this browser. Reopening the link on the same
               device continues at the next unanswered excerpt with the same pid.
               Cleared once the final submission is saved. */
            function saveProgress() {
                store(function(ls) {
                    ls.setItem(PROGRESS_KEY, JSON.stringify({
                        pid: S.pid,
                        files: FILES,
                        k: S.k,
                        about: S.about,
                        draw: S.draw,
                        at: Date.now()
                    }));
                });
            }

            function clearProgress() {
                store(function(ls) {
                    ls.removeItem(PROGRESS_KEY);
                });
            }

            function loadProgress() {
                var p = null;
                try {
                    p = JSON.parse(store(function(ls) {
                        return ls.getItem(PROGRESS_KEY);
                    }) || "null");
                } catch (e) {}
                var all = window.CLIPS || [];
                var valid = p && p.pid && p.files && p.files.length && typeof p.k === "number" &&
                    Date.now() - p.at < PROGRESS_MAX_H * 3600e3 &&
                    p.files.every(function(f) {
                        return all.indexOf(f) >= 0; /* excerpts changed since → start fresh */
                    });
                if (!valid) {
                    if (p) clearProgress();
                    return false;
                }
                FILES = p.files;
                S.pid = p.pid;
                S.k = p.k;
                S.about = p.about;
                S.draw = p.draw;
                return true;
            }

            function resume() {
                var left = FILES.length - S.k;
                stage.innerHTML =
                    '<div class="eyebrow">Welcome back</div>' +
                    '<h2>Continue where you left off</h2>' +
                    '<p class="lede">' + (left > 0 ?
                        "Your earlier answers are saved. You have " + left + " of " + FILES.length + " excerpts left." :
                        "You have answered all excerpts. Your answers still need to be submitted.") + '</p>' +
                    '<div class="actions"><span></span><button class="btn" id="next" type="button">' + (left > 0 ? "Continue" : "Submit") + '</button></div>';
                $("next").onclick = function() {
                    if (left > 0) {
                        audioFor(S.k);
                        audioFor(S.k + 1);
                        go("trial");
                    } else go("results");
                };
            }

            function audioFor(k) {
                if (k >= FILES.length) return null;
                if (!audios[k]) {
                    var a = new Audio("excerpts_8s_anonymized/" + FILES[k]);
                    a.preload = "auto";
                    audios[k] = a;
                }
                return audios[k];
            }

            function progress() {
                var total = FILES.length + 3,
                    step = {
                        welcome: 0,
                        raffle: 1,
                        about: 2,
                        trial: 3 + S.k,
                        results: total,
                        screened: total,
                        taken: total,
                        resume: 3 + S.k
                    }[S.screen];
                $("prog").style.width = (step / total * 100) + "%";
            }

            function go(screen) {
                S.screen = screen;
                progress();
                ({
                    welcome: welcome,
                    about: about,
                    trial: trial,
                    raffle: raffle,
                    results: results,
                    screened: screened,
                    taken: taken,
                    resume: resume
                })[screen]();
                stage.classList.remove("enter");
                void stage.offsetWidth; /* restart the animation */
                stage.classList.add("enter");
                if (screen === "trial") {
                    var card = stage.parentNode;
                    card.classList.remove("flash");
                    void card.offsetWidth;
                    card.classList.add("flash");
                }
                window.scrollTo(0, 0);
            }

            window.addEventListener("beforeunload", function(e) {
                if (S.screen === "trial") {
                    e.preventDefault();
                    e.returnValue = "";
                }
            });

            /* ---------- welcome ---------- */
            function welcome() {
                stage.innerHTML =
                    '<div class="eyebrow">About ' + EST_MINUTES + ' minutes · ' + FILES.length + ' excerpts</div>' +
                    '<h2>Song Recognition Survey</h2>' +
                    '<p class="lede">Thank you for taking part! I\'m selecting music for an upcoming experiment, and your responses will help me identify which songs are widely recognized so I can exclude them from the main study.</p>' +
                    '<ul class="rules">' +
                    '<li><span class="k">1</span><span><b>Listen and answer.</b>For each 8-second excerpt, tell me whether you know the song.</span></li>' +
                    '<li><span class="k">2</span><span><b>Respond based on your first impression.</b>You may answer while the excerpt is still playing.</span></li>' +
                    '<li><span class="k">3</span><span><b>Answer honestly.</b>Please don\'t look anything up, use song-identification apps, or ask anyone nearby. Your answers don\'t affect your chances in the raffle, and an honest "no" is just as useful to me as a "yes."</span></li>' +
                    '</ul>' +
                    '<div class="prize"><span class="ico" aria-hidden="true">' + GIFT + '</span>' +
                    '<strong>Raffle: $25 prize</strong>' +
                    '<p>Participants who complete the survey can enter a raffle for $25 (cash or gift card). You can opt in with your email address on the next page.</p>' +
                    '<p>Each person can enter once. After the survey closes, one participant will be selected at random and contacted by email.</p></div>' +
                    (FILES.length ? "" : '<p class="err">No excerpts are set up yet (clips.js is empty).</p>') +
                    '<div class="actions"><span></span><button class="btn" id="next" type="button"' + (FILES.length ? "" : " disabled") + '>Begin</button></div>';
                $("next").onclick = function() {
                    go("raffle");
                };
            }

            /* ---------- about you (screening + demographics) ---------- */
            function about() {
                var a = S.about;
                stage.innerHTML =
                    '<div class="eyebrow">Before you begin</div>' +
                    '<h2>About you</h2>' +
                    '<div class="field"><span class="lab" id="l-us">Are you currently located in the United States? <span class="req">*</span></span><div class="opts row" role="radiogroup" aria-labelledby="l-us">' + ["Yes", "No"].map(function(v) {
                        return opt("us", v, v, "", a.us === v);
                    }).join("") + '</div></div>' +
                    '<div class="field"><label for="f-age">What is your age? <span class="req">*</span></label><input type="number" id="f-age" min="1" max="120" inputmode="numeric" style="max-width:7.5rem" value="' + esc(a.age) + '"></div>' +
                    '<div class="field"><span class="lab" id="l-g">What is your gender? <span class="req">*</span></span><div class="opts" role="radiogroup" aria-labelledby="l-g">' + ["Female", "Male", "Non-binary", "Prefer not to say"].map(function(g) {
                        return opt("gender", g, g, "", a.gender === g);
                    }).join("") + '</div></div>' +
                    '<div class="field"><span class="lab" id="l-d">Approximately how many Disney animated films have you watched or know the songs from? <span class="req">*</span></span>' +
                    '<span class="hint">Count only films made by Walt Disney Animation Studios (not Marvel, Pixar, or live-action films).</span>' +
                    '<div class="opts row" role="radiogroup" aria-labelledby="l-d">' + COUNTS.map(function(v) {
                        return opt("disney", v, v, "", a.disney === v);
                    }).join("") + '</div></div>' +
                    '<div class="field"><span class="lab" id="l-m">Approximately how many non-Disney musicals have you watched or know the songs from? <span class="req">*</span></span>' +
                    '<span class="hint">A musical is a stage show or film in which the story is told largely through songs.</span>' +
                    '<div class="opts row" role="radiogroup" aria-labelledby="l-m">' + COUNTS.map(function(v) {
                        return opt("musicals", v, v, "", a.musicals === v);
                    }).join("") + '</div></div>' +
                    '<div class="actions"><button class="btn ghost" type="button" id="back">Back</button><button class="btn" id="next" type="button">Continue</button></div>';
                var age = $("f-age");

                function check() {
                    $("next").disabled = !(a.us && a.age && +a.age >= 1 && +a.age <= 120 && a.gender && a.disney && a.musicals);
                }
                age.oninput = function() {
                    a.age = age.value;
                    check();
                };
                ["us", "gender", "disney", "musicals"].forEach(function(g) {
                    bindOpts(g, function(v) {
                        a[g] = v;
                        check();
                    });
                });
                check();
                $("back").onclick = function() {
                    go("raffle");
                };
                $("next").onclick = function() {
                    if (eligible()) {
                        S.k = 0;
                        saveProgress();
                        audioFor(0);
                        audioFor(1);
                        go("trial");
                    } else {
                        store(function(ls) {
                            ls.setItem(SCREENED_KEY, "1");
                        });
                        post(JSON.stringify(Object.assign({
                            kind: "screened"
                        }, background(), raffleInfo())));
                        go("screened");
                    }
                };
            }

            function eligible() {
                var a = S.about;
                return a.us === "Yes" && +a.age >= 18 && parseInt(a.disney, 10) + parseInt(a.musicals, 10) >= MIN_EXPOSURE;
            }

            function screened() {
                stage.innerHTML =
                    '<div class="eyebrow">Thank you</div>' +
                    '<h2>Thank you for your interest.</h2>' +
                    '<p class="lede">This study is looking for listeners with particular backgrounds, and based on your answers, you are not in the group needed this time. Nothing more is needed from you. You can close this page.</p>';
            }

            /* ---------- trial ---------- */
            var PLAY = '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M5 3.5v13l11-6.5z"/></svg>';
            var REPLAY = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 10a6 6 0 1 0 2-4.5"/><path d="M4 3v3.5h3.5"/></svg>';

            function trial() {
                var k = S.k,
                    file = FILES[k],
                    a = audioFor(k);
                audioFor(k + 1);
                var t = S.trials[k] = {
                    clip_id: file.replace(/\.[^.]+$/, ""),
                    position: k + 1,
                    response: "",
                    text: "",
                    response_ms: null,
                    submit_ms: null,
                    replays: 0,
                    paste_blocked: 0,
                    changed: false
                };
                var onset = null,
                    plays = 0,
                    playing = false;
                stage.innerHTML =
                    '<div class="eyebrow">Excerpt ' + (k + 1) + ' of ' + FILES.length + '</div>' +
                    '<h2>Do you recognize this song?</h2>' +
                    '<div class="player"><button class="play" id="play" type="button" aria-label="Play excerpt">' + PLAY + '</button>' +
                    '<div><div class="track"><i id="bar"></i></div><div class="pmeta"><span id="pstate">Press play when you are ready.</span><span id="ptime"></span></div></div></div>' +
                    '<div class="opts" role="radiogroup" aria-label="Do you recognize this song?">' +
                    RESP.map(function(r) {
                        return opt("resp", r.v, r.t, "", false, true);
                    }).join("") + '</div>' +
                    '<div class="field" id="box-title" hidden><label for="f-title">Song title <span class="req">*</span></label><input type="text" id="f-title" autocomplete="off" spellcheck="false"></div>' +
                    '<div class="field" id="box-recall" hidden><label for="f-recall">What clues can you remember? <span class="req">*</span></label><span class="hint">For example, the film or musical it comes from, the singer, the composer, etc.</span><input type="text" id="f-recall" autocomplete="off"></div>' +
                    '<p class="flag" id="flag" hidden></p>' +
                    '<div class="actions"><span></span><button class="btn" id="next" type="button" disabled>' + (k + 1 === FILES.length ? "Submit" : "Next excerpt") + '</button></div>';
                var ti = $("f-title"),
                    re = $("f-recall"),
                    pb = $("play");
                [ti, re].forEach(function(el) {
                    ["paste", "drop"].forEach(function(ev) {
                        el.addEventListener(ev, function(e) {
                            e.preventDefault();
                            t.paste_blocked++;
                            $("flag").hidden = false;
                            $("flag").textContent = "Pasting is disabled. Please type your answer.";
                        });
                    });
                });

                function ui() {
                    pb.disabled = playing;
                    pb.innerHTML = plays === 0 || playing ? PLAY : REPLAY;
                    pb.setAttribute("aria-label", plays === 0 ? "Play excerpt" : "Replay excerpt");
                    $("pstate").textContent = playing ? "Playing" : plays === 0 ? "Press play when you are ready." : "Replay if you like";
                }
                a.ontimeupdate = function() {
                    var d = isFinite(a.duration) && a.duration > 0 ? a.duration : 8;
                    $("bar").style.width = Math.min(100, a.currentTime / d * 100) + "%";
                    $("ptime").textContent = a.currentTime.toFixed(1) + " / " + d.toFixed(1) + " s";
                };
                a.onplaying = function() {
                    if (onset === null) {
                        onset = performance.now();
                        stage.querySelectorAll('label.opt[data-g="resp"]').forEach(function(l) {
                            l.classList.remove("dis");
                            l.querySelector("input").disabled = false;
                        });
                    }
                };
                a.onended = function() {
                    playing = false;
                    ui();
                };
                a.onerror = function() {
                    playing = false;
                    ui();
                    $("pstate").textContent = "The excerpt didn't load. Check your connection and press play again.";
                };
                pb.onclick = function() {
                    plays++;
                    t.replays = Math.max(0, plays - 1);
                    playing = true;
                    ui();
                    a.currentTime = 0;
                    var p = a.play();
                    if (p && p.catch) p.catch(function() {
                        playing = false;
                        plays = Math.max(0, plays - 1);
                        t.replays = Math.max(0, plays - 1);
                        ui();
                        $("pstate").textContent = "The excerpt didn't play. Please press play again.";
                    });
                };
                bindOpts("resp", function(v) {
                    if (onset === null) return;
                    if (t.response_ms === null) t.response_ms = Math.round(performance.now() - onset);
                    else if (t.response !== v) t.changed = true;
                    t.response = v;
                    t.text = v === "title" ? ti.value : v === "recall" ? re.value : "";
                    $("box-title").hidden = v !== "title";
                    $("box-recall").hidden = v !== "recall";
                    check();
                    if (v === "title") ti.focus();
                    else if (v === "recall") re.focus();
                });
                ti.oninput = function() {
                    t.text = ti.value;
                    check();
                };
                re.oninput = function() {
                    t.text = re.value;
                    check();
                };
                [ti, re].forEach(function(el) {
                    el.addEventListener("keydown", function(e) {
                        if (e.key === "Enter" && !$("next").disabled) $("next").click();
                    });
                });

                function check() {
                    $("next").disabled = !(t.response && (t.response === "no" || t.text.trim()));
                }
                $("next").onclick = function() {
                    t.submit_ms = Math.round(performance.now() - onset);
                    saveTrial(t);
                    a.pause();
                    a.ontimeupdate = a.onplaying = a.onended = a.onerror = null;
                    delete audios[k];
                    S.k = k + 1;
                    saveProgress();
                    if (S.k < FILES.length) go("trial");
                    else go("results");
                };
            }

            /* ---------- raffle entry ---------- */
            function raffle() {
                var w = S.draw;
                stage.innerHTML =
                    '<div class="eyebrow">Before you begin</div>' +
                    '<h2>Would you like to enter the raffle?</h2>' +
                    '<p class="lede">Participants who complete the survey can enter a raffle for $25 (cash or gift card). Your answers don\'t affect your chances.</p>' +
                    '<div class="opts" role="radiogroup" aria-label="Raffle">' +
                    opt("draw", "yes", "Yes, enter me in the raffle", "", w.mode === "yes") +
                    opt("draw", "no", "No, thanks", "", w.mode === "no") +
                    '</div>' +
                    '<div class="field" id="emBox"' + (w.mode === "yes" ? "" : " hidden") + '><label for="f-email">Email address <span class="req">*</span></label><span class="hint">Used only to contact the selected participant. One entry per person; repeat entries with the same email don\'t count.</span><input type="email" id="f-email" autocomplete="email" value="' + esc(w.email) + '"><span class="err" id="emErr" hidden>Please enter a valid email address.</span></div>' +
                    '<div class="actions"><button class="btn ghost" type="button" id="back">Back</button><button class="btn" id="next" type="button">Continue</button></div>';
                var em = $("f-email");

                function okEmail() {
                    return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(w.email.trim());
                }

                function check() {
                    $("next").disabled = !(w.mode === "no" || (w.mode === "yes" && okEmail()));
                }
                bindOpts("draw", function(v) {
                    w.mode = v;
                    $("emBox").hidden = v !== "yes";
                    check();
                    if (v === "yes") em.focus();
                });
                em.oninput = function() {
                    w.email = em.value;
                    $("emErr").hidden = true;
                    check();
                };
                em.onblur = function() {
                    $("emErr").hidden = !w.email.trim() || okEmail();
                };
                check();
                $("back").onclick = function() {
                    go("welcome");
                };
                $("next").onclick = function() {
                    if (w.mode !== "yes") return go("about");
                    /* Has this email already finished (or been screened out)? If the
                       check fails or is slow, let them continue: the server still
                       refuses a second raffle entry at the end. */
                    var btn = $("next");
                    btn.disabled = true;
                    btn.textContent = "Checking…";
                    var done = false;

                    function to(screen) {
                        if (done) return;
                        done = true;
                        if (screen === "screened") store(function(ls) {
                            ls.setItem(SCREENED_KEY, "1");
                        });
                        go(screen);
                    }
                    setTimeout(function() {
                        to("about");
                    }, 8000);
                    if (!connected()) return to("about");
                    fetch(window.SCRIPT_URL, {
                            method: "POST",
                            body: JSON.stringify({
                                kind: "check",
                                email: w.email.trim()
                            })
                        })
                        .then(function(r) {
                            return r.json();
                        })
                        .then(function(res) {
                            to(res.status === "complete" ? "taken" : res.status === "screened_out" ? "screened" : "about");
                        })
                        .catch(function() {
                            to("about");
                        });
                };
            }

            function taken() {
                stage.innerHTML =
                    '<div class="eyebrow">Thank you</div>' +
                    '<h2>You have already completed this survey.</h2>' +
                    '<p class="lede">Each person can take part once, and your earlier response is already recorded. Nothing more is needed from you, and you can close this page.</p>';
            }

            /* ---------- submit + results ---------- */
            function connected() {
                return /^https:\/\/script\.google(usercontent)?\.com\//.test(window.SCRIPT_URL || "");
            }

            /* Fire-and-forget POST (used for each excerpt and for screened-out visits). */
            function post(body) {
                if (!connected()) return;
                try {
                    fetch(window.SCRIPT_URL, {
                        method: "POST",
                        body: body,
                        keepalive: true
                    }).catch(function() {});
                } catch (e) {}
            }

            /* Each excerpt's response is saved once, when "Next" is clicked, so data
               from people who quit early is kept. The final submission doesn't
               resend trials. */
            function saveTrial(t) {
                post(JSON.stringify({
                    kind: "trial",
                    pid: S.pid,
                    trial: t
                }));
            }

            function background() {
                var tz = "";
                try {
                    tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
                } catch (e) {}
                return {
                    pid: S.pid,
                    age: +S.about.age,
                    gender: S.about.gender,
                    disney_films: S.about.disney,
                    musicals: S.about.musicals,
                    us_located: S.about.us,
                    timezone: tz,
                    device: window.matchMedia && window.matchMedia("(pointer: coarse)").matches ? "touch" : "desktop"
                };
            }

            function raffleInfo() {
                var entered = S.draw.mode === "yes";
                return {
                    raffle: entered,
                    email: entered ? S.draw.email.trim() : ""
                };
            }

            function payload() {
                return Object.assign(background(), raffleInfo());
            }

            function results() {
                if (S.result) return showResults();
                stage.innerHTML = '<div class="eyebrow">Almost done</div><h2>Saving your answers…</h2><div class="spin" role="status" aria-label="Saving"></div>';
                var body = JSON.stringify(payload());
                store(function(ls) {
                    ls.setItem("songSurveyBackup_" + S.pid, body);
                });
                if (!connected()) return failed("The survey isn't connected to its spreadsheet yet.");
                fetch(window.SCRIPT_URL, {
                        method: "POST",
                        body: body
                    })
                    .then(function(r) {
                        if (!r.ok) throw new Error("HTTP " + r.status);
                        return r.json();
                    })
                    .then(function(res) {
                        S.result = res;
                        clearProgress();
                        store(function(ls) {
                            ls.removeItem("songSurveyBackup_" + S.pid);
                        });
                        showResults();
                    })
                    .catch(function() {
                        failed("Your answers couldn't be sent. Please check your internet connection and try again.");
                    });
            }

            function failed(msg) {
                stage.innerHTML = '<div class="eyebrow">Not saved yet</div><h2>Something went wrong</h2><p class="lede">' + esc(msg) + ' Please keep this page open.</p>' +
                    '<div class="actions"><span></span><button class="btn" id="retry" type="button">Try again</button></div>';
                $("retry").onclick = function() {
                    results();
                };
            }

            function showResults() {
                var res = S.result,
                    entered = S.draw.mode === "yes";
                var note = !entered ? "" :
                    res.duplicate ? '<p class="lede">This email address has already been entered, so this attempt doesn\'t add another entry.</p>' :
                    '<div class="prize short"><span class="ico" aria-hidden="true">' + GIFT + '</span>' +
                    '<strong>You are entered in the raffle</strong>' +
                    '<p>Thank you for completing the survey. You will be considered for the $25 prize (cash or gift card). After the survey closes, one participant will be selected at random and contacted by email.</p></div>';
                stage.innerHTML =
                    '<div class="eyebrow">Survey complete</div>' +
                    '<h2>Thank you for participating.</h2>' +
                    note +
                    '<p class="small">You can close this page.</p>';
            }

            /* ---------- shared ---------- */
            function opt(group, val, title, sub, sel, dis) {
                return '<label class="opt' + (sel ? " sel" : "") + (dis ? " dis" : "") + '" data-g="' + group + '" data-v="' + esc(val) + '">' +
                    '<input type="radio" name="' + group + '" value="' + esc(val) + '"' + (sel ? " checked" : "") + (dis ? " disabled" : "") + '>' +
                    '<span class="dot"></span><span><span class="opt-t">' + esc(title) + '</span>' + (sub ? '<span class="opt-s">' + esc(sub) + "</span>" : "") + "</span></label>";
            }

            function bindOpts(group, cb) {
                stage.querySelectorAll('label.opt[data-g="' + group + '"]').forEach(function(l) {
                    l.querySelector("input").addEventListener("change", function() {
                        stage.querySelectorAll('label.opt[data-g="' + group + '"]').forEach(function(o) {
                            o.classList.toggle("sel", o === l);
                        });
                        cb(l.getAttribute("data-v"));
                    });
                });
            }

            go(store(function(ls) {
                return ls.getItem(SCREENED_KEY);
            }) ? "screened" : loadProgress() ? "resume" : "welcome");
        })();
    </script>
</body>

</html>
